   name: Collaborative Workflow

   on:
     push:
       branches:
         - main

   jobs:
     update_html_and_readme:
       runs-on: ubuntu-latest
       steps:
         # Step 1: Checkout the repository
         - name: Checkout Repository
           uses: actions/checkout@v3

         # Step 2: Update index.html

         # Check if the GitHub actor is the team leader
         # Run the following CLI command to update index.html
         - name: Update index.html (Team Leader)
           if: github.actor == 'yashreyli'
           run: |
             sed -i '/<\/body>/i <p>Updated by Team Leader on '"$(date)"'</p>' index.html

         # Check if the GitHub actor is Member 1
         - name: Update index.html (Member 1)
           if: github.actor == 'member1-username'
           run: |
             sed -i '/<\/body>/i <p>Updated by Member 1 on '"$(date)"'</p>' index.html

         # Check if the GitHub actor is Member 2
         - name: Update index.html (Member 2)
           if: github.actor == 'member2-username'
           run: |
             sed -i '/<\/body>/i <p>Updated by Member 2 on '"$(date)"'</p>' index.html

         # Step 3: Update README
         # Append a log entry to the README.md file
         - name: Update README
           run: |
             echo "### Updated by ${{ github.actor }} on $(date '+%Y-%m-%d %H:%M:%S') [Commit: $(git rev-parse --short HEAD)]" >> README.md
